name: POC compiler checks

on:
  push:
    branches: [main]
    paths-ignore: &docs-only-paths
      - '*.md'
      - 'docs/**/*.md'
      - 'docs/**/*.png'
      - 'docs/**/*.svg'
  pull_request:
    paths-ignore: *docs-only-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean compiler and contract examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check project branding
        run: python3 scripts/check-branding.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build the POC compiler
        run: lake build noctium Noctium.Compiler Noctium.Foreign Noctium.Claim Noctium.Verification.RangeDedup
      - name: Check the private claim source-proof report
        run: python3 scripts/proofs/check-private-claim-audit.py --report
      - name: Check source contract examples
        run: |
          lake env lean examples/PrivateClaim.lean
          lake env lean examples/BoundedScalars.lean
          lake env lean examples/Disclosure.lean
          lake env lean tests/Disclosure.lean
          lake env lean examples/NoctiumPrivateClaim.lean
          lake env lean examples/PrivateStateCounter.lean
          lake env lean tests/Issue68MapReads.lean
          lake env lean tests/Issue69Bytes32Map.lean
          lake env lean tests/Issue69NestedCounter.lean
          lake env lean tests/Issue69CompositeMap.lean
          lake env lean tests/Issue70PersistentHash.lean
          lake env lean tests/Issue70HashPreimages.lean
          lake env lean tests/Issue70Jubjub.lean
          lake env lean tests/Issue70DerivedCrypto.lean
          lake env lean tests/NativeInverse.lean
          lake env lean tests/NativeByteConversions.lean
          lake env lean tests/NativeBytePacking.lean
          lake env lean tests/NativeByteIndexing.lean
          lake env lean tests/NativeByteReverse.lean
          lake env lean tests/NativeBytes.lean
          lake env lean tests/BytesStorage.lean
          lake env lean tests/ScalarFromBytes.lean
          lake env lean tests/TransientHash.lean
          lake env lean tests/SignatureChecks.lean
          lake env lean tests/NativeHelperBranches.lean
          lake env lean tests/GuardedWitness.lean
          lake env lean tests/GuardedLedgerLocalnet.lean
          lake env lean tests/TypedMultiEntryWitness.lean
          lake env lean tests/StructuredCells.lean
          lake env lean tests/StructuredMaps.lean
          lake env lean tests/NativePreparationCursor.lean
          lake env lean tests/ImpactEffectBoundaries.lean
          lake env lean tests/HostedLedgerWitness.lean
          lake env lean tests/TypedWitnessResultCodec.lean
          lake env lean tests/LedgerWitnessTransform.lean
          lake env lean tests/StructuredLedgerWitness.lean
          lake env lean tests/StructuredTypedCells.lean
          lake env lean tests/FiniteRangeWitness.lean
          lake env lean tests/ReadableFiniteRange.lean
          lake env lean tests/ReadableContainerLoop.lean
          lake env lean tests/ReadableIteration.lean
          lake env lean tests/IterationWitness.lean
          lake env lean tests/Helpers.lean
          lake env lean tests/Iteration.lean
          lake env lean tests/EmptyTupleIteration.lean
          lake env lean tests/CompositeValues.lean
          lake env lean tests/ComponentDisclosure.lean
          lake env lean tests/GenericSpecialization.lean
          lake env lean tests/Control.lean
          lake env lean --run tests/NativeProducer.lean
          lake env lean tests/ByteHashes.lean
          lake env lean tests/TypedPointKeccak.lean
          lake env lean tests/BooleanGates.lean
          lake env lean tests/LazyBoolean.lean
          lake env lean tests/LazyConditional.lean
          lake env lean tests/HashToCurve.lean
          lake env lean tests/ForeignTransport.lean
          lake env lean tests/ForeignPointLiterals.lean
          lake env lean tests/ForeignOperations.lean
          lake env lean tests/ForeignStorage.lean
          lake env lean tests/ForeignTree.lean
          lake env lean tests/ForeignKeys.lean
          lake env lean tests/JubjubStorage.lean
          lake env lean tests/Curve25519.lean
          lake env lean --run tests/Curve25519Encoding.lean > /tmp/noctium-curve25519-encoding.json
          cmp /tmp/noctium-curve25519-encoding.json runtime/tests/fixtures/curve25519/321/encoding.json
          lake env lean --run tests/ForeignEncoding.lean > /tmp/noctium-foreign-encoding.json
          cmp /tmp/noctium-foreign-encoding.json runtime/tests/fixtures/foreign-codec/321/encoding.json
          lake env lean tests/CurveWitness.lean
          lake env lean tests/Curve25519Witness.lean
          lake env lean tests/CurveHelpers.lean
          lake env lean tests/HashWitness.lean
          lake env lean tests/NestedEscrow.lean
          lake env lean tests/NativeCounter.lean
          lake env lean tests/CounterAmounts.lean
          lake env lean tests/CounterCompare.lean
          lake env lean tests/NativeSet.lean
          lake env lean tests/NativeCaller.lean
          lake env lean tests/NativeCellReset.lean
          lake env lean tests/NativeStandaloneMints.lean
          lake env lean tests/ShieldedReceive.lean
          lake env lean tests/FundedShieldedReceive.lean
          lake env lean tests/ShieldedSpend.lean
          lake env lean tests/ShieldedMapPartialSpend.lean
          lake env lean tests/ShieldedImmediateRelay.lean
          lake env lean tests/QualifiedCoinCell.lean
          lake env lean tests/QualifiedCoinSet.lean
          lake env lean tests/NativeTaggedSettlement.lean
          lake env lean tests/NativeUnshieldedSend.lean
          lake env lean tests/NativeUnshieldedMintRecipient.lean
          lake env lean tests/NativeContractAddress.lean
          lake env lean tests/NativeTokenBalance.lean
          lake env lean tests/NativeBlockTime.lean
          lake env lean tests/NativeList.lean
          lake env lean tests/NativeScalarList.lean
          lake env lean tests/NativeScalarListMaybe.lean
          lake env lean tests/NativeMapDefault.lean
          lake env lean tests/OptionalListHead.lean
          lake env lean tests/MixedLedgerRecord.lean
          lake env lean tests/MerkleTree.lean
          lake env lean tests/MerkleIndexed.lean
          lake env lean tests/HistoricMerkle.lean
          lake env lean tests/NestedMerkle.lean
          lake env lean tests/TypedMerkleLeaves.lean
          lake env lean tests/RecordMerkleLeaves.lean
          lake env lean tests/JubjubMerkleLeaves.lean
          lake env lean tests/ForeignMerkleLeaves.lean
          lake env lean tests/NativeReturns.lean
          lake env lean tests/TypedCallArguments.lean
          lake env lean tests/ContractInterfaces.lean
          lake env lean tests/ContractInterfaceComposition.lean
          lake env lean tests/NativeCallClaims.lean
          lake env lean tests/NativeCopy.lean
          lake env lean tests/NativeOpaqueReturns.lean
          lake env lean tests/OpaqueByteMap.lean
          lake env lean tests/Issue43ConditionalWrites.lean
          lake env lean tests/Issue43EmptyActivity.lean
          lake env lean tests/Issue43MapMembership.lean
          lake env lean tests/Issue43GuardedPartialWrites.lean
          lake env lean tests/Issue43GuardedReads.lean
          lake env lean tests/NativeCheckpoint.lean
          lake env lean tests/NativeCheckpointPartial.lean
          lake env lean tests/Issue43EffectBlocks.lean
          lake env lean examples/openzeppelin/PublicSupply.lean
          lake env lean examples/openzeppelin/ConfidentialToken.lean
          role_dir=$(mktemp -d)
          trap 'rm -rf "$role_dir"' EXIT
          .lake/build/bin/noctium compile examples/openzeppelin/ShieldedRoleGate.lean \
            --target profiles/midnight-ledger-9-zkir-3.2.1-target.json \
            --dedup-range-checks --emit ledger --emit witness --output "$role_dir"
          test "$(wc -c < "$role_dir/OpenZeppelinPort.ShieldedRoleGate.ShieldedRoleGate.protectedAction.impact.json")" -le 2097152
      - name: Check guarded effects with and without range deduplication
        run: |
          artifacts=$(mktemp -d)
          trap 'rm -rf "$artifacts"' EXIT
          .lake/build/bin/noctium compile tests/Issue43EffectBlocks.lean \
            --target profiles/midnight-ledger-9-zkir-3.2.1-target.json \
            --emit ledger --output "$artifacts/default"
          .lake/build/bin/noctium compile tests/Issue43EffectBlocks.lean \
            --target profiles/midnight-ledger-9-zkir-3.2.1-target.json \
            --dedup-range-checks --emit ledger --output "$artifacts/dedup"
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          NOCTIUM_EFFECT_BLOCKS_DIR="$artifacts" \
            cargo +1.100.0 test --manifest-path runtime/Cargo.toml --locked \
              --no-default-features --features zkir-321 --test effect_blocks
      - name: Check source proof registration
        run: |
          lake build Noctium.Verification
          lake env lean tests/Verification.lean
      - name: Check readable private state source and disclosure
        run: |
          bash tests/private-authoring-cli.sh
          bash tests/disclosure-cli.sh
      - name: Check module identity and re-export disclosure
        run: bash tests/modules/check.sh
