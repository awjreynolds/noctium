name: Source assurance replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Replay the two pinned source reports
        run: |
          python3 scripts/proofs/check-private-claim-audit.py --report
          python3 scripts/proofs/check-private-claim-audit.py --report --operation BoundedScalars.apply
