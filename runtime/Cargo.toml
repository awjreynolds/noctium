[package]
name = "noctium-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = ["web"]
default-members = ["."]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["zkir-320"]
zkir-320 = ["dep:zkir-320"]
zkir-321 = ["dep:zkir-321"]
localnet = ["dep:reqwest", "dep:bip32", "dep:frame-metadata", "dep:scale-info", "dep:parity-scale-codec", "dep:scale-value", "dep:blake2", "dep:libc", "dep:zswap"]

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
hex = "0.4"
sha2 = "0.11"
sha3 = "0.11"
zeroize = "1.9"
rand = "0.8"
futures = "0.3"
midnight-proofs = "=0.8.3"
midnight-zk-stdlib = "=2.4.0"
builtin-zkir = { package = "midnight-zkir", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
bip32 = { version = "0.5.3", optional = true }
frame-metadata = { version = "23", optional = true }
scale-info = { version = "2.11", optional = true }
parity-scale-codec = { version = "3.7", optional = true }
scale-value = { version = "0.18", optional = true }
blake2 = { version = "0.10.6", optional = true }
libc = { version = "0.2", optional = true }
ledger = { package = "midnight-ledger-v9", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
zswap = { package = "midnight-zswap", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74", optional = true }
onchain-runtime = { package = "midnight-onchain-runtime", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
base-crypto = { package = "midnight-base-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
transient-crypto = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74", features = ["public-internal-structure"] }
serialize = { package = "midnight-serialize", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
storage = { package = "midnight-storage", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74", default-features = false }
coin-structure = { package = "midnight-coin-structure", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
zkir-320 = { package = "midnight-zkir", git = "https://github.com/midnightntwrk/midnight-zkir", rev = "446c7fecc6bd41dab99ebe89ab404e9d077d11a9", optional = true }
zkir-321 = { package = "midnight-zkir", git = "https://github.com/midnightntwrk/midnight-zkir", rev = "7a51b3385bbf4bce3604df87a7c70867c9ab43c0", optional = true }

[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a2b30128ca4b660b73a068e29b56b48ede8c9a74" }

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "native_client"
required-features = ["localnet"]

[[example]]
name = "audit_claim_deployment"
required-features = ["localnet", "zkir-321"]

[[example]]
name = "confidential_token_localnet"
required-features = ["localnet", "zkir-321"]

[[example]]
name = "opaque_byte_map_localnet"
required-features = ["localnet", "zkir-321"]

[[example]]
name = "browser_localnet_provider"
required-features = ["localnet", "zkir-321"]
